# Local integration ONLY. Do not use these sample credentials on a public host.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mushee_dev
      POSTGRES_USER: mushee_dev
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - mushee-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U mushee_dev -d mushee_dev"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrations:
    build: .
    command: node scripts/migrate.js
    environment:
      DATABASE_URL: postgresql://mushee_dev:local_development_only@postgres:5432/mushee_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    command: node server.js
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://mushee_dev:local_development_only@postgres:5432/mushee_dev
      PORT: "3000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
  collector:
    build: .
    command: node services/streamer.js
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://mushee_dev:local_development_only@postgres:5432/mushee_dev
      STREAM_PORT: "3001"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  mushee-postgres:
